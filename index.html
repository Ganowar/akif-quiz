<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Spelling Quiz – আকিফ</title>
<style>
:root{--bg1:#4f46e5;--bg2:#06b6d4;--card:#ffffff;--ink:#1e293b;--ok:#16a34a;--bad:#dc2626}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;font-family:"Noto Sans Bengali","Hind Siliguri","Kalpurush","SolaimanLipi","Segoe UI",Roboto,Arial,sans-serif;
 background:linear-gradient(135deg,var(--bg1),var(--bg2));color:var(--ink);display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:var(--card);width:100%;max-width:520px;border-radius:24px;box-shadow:0 20px 50px rgba(0,0,0,.25);padding:22px 20px 24px;position:relative;overflow:hidden}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:16px;color:#475569}
.badge{background:#eef2ff;color:#4338ca;padding:6px 12px;border-radius:999px}
.score{background:#ecfdf5;color:#047857;padding:6px 12px;border-radius:999px}
.bar{height:8px;background:#e2e8f0;border-radius:99px;margin:14px 0 6px;overflow:hidden}
.bar>div{height:100%;width:0;background:linear-gradient(90deg,#f59e0b,#ef4444,#8b5cf6);transition:width .4s}
h1{font-size:20px;text-align:center;margin:10px 0 2px}
.lesson{text-align:center;font-size:13px;color:#64748b}
.speak{display:flex;gap:12px;justify-content:center;align-items:center;margin:16px 0 8px}
#play{width:76px;height:76px;border-radius:50%;border:0;font-size:35px;cursor:pointer;color:#fff;
 background:radial-gradient(circle at 30% 30%,#fb923c,#e11d48);box-shadow:0 10px 24px rgba(225,29,72,.4);transition:transform .15s}
#play:active{transform:scale(.93)}
#play.pulse{animation:pulse 1s ease-in-out 2}
@keyframes pulse{50%{transform:scale(1.08);box-shadow:0 0 0 14px rgba(225,29,72,.15)}}
#play:disabled,#slow:disabled{filter:grayscale(1);opacity:.5;cursor:not-allowed;animation:none;box-shadow:none}
.left{font-size:13px;font-weight:600;color:#475569;text-align:center;margin-top:4px}
.pnote{text-align:center;font-size:14px;color:#64748b;min-height:0}
#slow{border:2px solid #cbd5e1;background:#fff;border-radius:14px;padding:10px 12px;font-size:15px;cursor:pointer;font-family:inherit}
.hint{text-align:center;font-size:20px;color:#334155;margin:4px 0 14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{min-height:72px;border:0;border-radius:18px;font-size:21px;font-weight:700;color:#fff;cursor:pointer;padding:10px;
 letter-spacing:.5px;transition:transform .12s,filter .2s,background .2s;word-break:break-word;font-family:"Segoe UI",Roboto,Arial,sans-serif}
.opt:active{transform:scale(.96)}
.c0{background:#3b82f6}.c1{background:#a855f7}.c2{background:#f59e0b}.c3{background:#14b8a6}
.opt.right{background:var(--ok)!important;box-shadow:0 0 0 4px #bbf7d0}
.opt.wrong{background:var(--bad)!important;animation:shake .45s}
.opt.dim{filter:grayscale(.7) opacity(.55)}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(7px)}}
.msg{min-height:56px;text-align:center;font-size:19px;font-weight:700;margin:14px 0 6px}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:16px;font-size:20px;font-weight:700;color:#fff;cursor:pointer;
 background:linear-gradient(90deg,#4f46e5,#06b6d4);font-family:inherit;visibility:hidden}
.btn.show{visibility:visible}
.tbar{height:4px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin-bottom:8px;visibility:hidden}.tbar.show{visibility:visible}.tbar>div{height:100%;width:0;background:#4f46e5}.tbar.run>div{animation:tb 2s linear forwards}@keyframes tb{to{width:100%}}
.final{text-align:center;display:none}
.final .big{font-size:64px;font-weight:800;color:#4338ca;margin:8px 0}
.final p{font-size:19px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:9}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="card">
 <div id="game">
  <div class="top"><span class="badge" id="qno">প্রশ্ন ১/১০</span><span class="score" id="score">স্কোর: ০</span></div>
  <div class="bar"><div id="prog"></div></div>
  <h1>🔊 শুনে সঠিক বানানটি বেছে নাও</h1>
  <div class="lesson" id="lesson"></div>
  <div class="speak">
   <div><button id="play" aria-label="Play word">🔊</button><div class="left" id="left">১০ বার বাকি</div></div>
   <button id="slow">🐢 ধীরে আবার</button>
  </div>
  <div class="pnote" id="pnote"></div>
  <div class="hint" id="hint"></div>
  <div class="grid" id="opts"></div>
  <div class="msg" id="msg"></div>
  <div class="tbar" id="tbar"><div></div></div>
  <button class="btn" id="next">পরের শব্দ ➡</button>
 </div>
 <div class="final" id="final">
  <h1>Spelling Quiz শেষ!</h1>
  <div class="big" id="fscore"></div>
  <p id="fmsg"></p>
  <button class="btn show" id="again">🔁 আবার খেলো</button>
 </div>
</div>

let order=[],i=0,score=0,locked=false,timer=null,plays=0;const MAXP=10;
function updPlays(){const out=plays>=MAXP;$("play").disabled=out;$("slow").disabled=out;$("left").textContent=bn(Math.max(0,MAXP-plays))+" বার বাকি";$("pnote").textContent=out?"আওয়াজ শেষ ("+bn(MAXP)+"/"+bn(MAXP)+")":""}
function tryPlay(w,slow,fc){if(plays>=MAXP)return;plays++;try{playsUsed[order[i].w]=plays}catch(e){};updPlays();say(w,slow,fc)}
const shuffle=a=>{a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};

// ---- result reporting (Google Form). Fill FORM after Anowar creates the form; empty = off ----
const FORM={url:"",name:"",date:"",score:"",wrong:"",detail:""}; // url: https://docs.google.com/forms/d/e/<id>/formResponse ; others: entry.NNNN
let wrongList=[];const playerName="আকিফ";
function stamp(){const d=new Date();return d.toLocaleString("en-GB",{timeZone:"Asia/Dhaka"})}
// ---- private result report ----
const NTFY="https://ntfy.sh/akq-0h8m2j4ealwie5nm";let playsUsed={};
function dhakaISO(){const d=new Date(Date.now()+6*3600e3);return d.toISOString().replace("Z","+06:00")}
function ntfyQueue(){try{return JSON.parse(localStorage.getItem("bq_ntfy2")||"[]")}catch(e){return[]}}
function ntfyFlush(){const q=ntfyQueue();if(!q.length)return;
 fetch(NTFY,{method:"POST",headers:{"Content-Type":"text/plain","X-Cache":"yes"},body:q[0]})
 .then(r=>{if(r.ok){q.shift();localStorage.setItem("bq_ntfy2",JSON.stringify(q));const m=document.getElementById("sentnote");if(m)m.textContent="ফলাফল পাঠানো হয়েছে ✅";if(q.length)ntfyFlush()}}).catch(()=>{})}
function reportNtfy(){
 const body=JSON.stringify({name:playerName,quiz:"spelling",time:dhakaISO(),score:score,total:order.length,wrong:wrongList,plays_used:playsUsed});
 const q=ntfyQueue();q.push(body);localStorage.setItem("bq_ntfy2",JSON.stringify(q));ntfyFlush();
}
addEventListener("load",ntfyFlush);
addEventListener("online",ntfyFlush);
// Google Form sending below is kept but disabled (FORM.url empty)
function sendResult(final){
 if(final)reportNtfy();
 if(!FORM.url)return;
 const b=new URLSearchParams();b.append(FORM.name,playerName);b.append(FORM.date,stamp());
 b.append(FORM.score,final?(score+"/"+order.length):("চলছে "+score+"/"+(i+1)));b.append(FORM.wrong,wrongList.join(", ")||"-");
 if(FORM.detail)b.append(FORM.detail,final?"final":"after Q"+(i+1));
 const q=JSON.parse(localStorage.getItem("bq_queue")||"[]");q.push(b.toString());localStorage.setItem("bq_queue",JSON.stringify(q));flush();
}
function flush(){const q=JSON.parse(localStorage.getItem("bq_queue")||"[]");if(!q.length||!navigator.onLine)return;
 const body=q[0];fetch(FORM.url,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/x-www-form-urlencoded"},body}).then(()=>{q.shift();localStorage.setItem("bq_queue",JSON.stringify(q));if(q.length)flush()}).catch(()=>{})}
addEventListener("online",flush);

function tts(text,rate){
 if(!("speechSynthesis" in window))return false;
 try{const ss=speechSynthesis;ss.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=rate;
  const vs=ss.getVoices();const v=vs.find(x=>x.lang==="en-US"||x.lang==="en_US")||vs.find(x=>x.lang==="en-GB");if(v){u.voice=v;u.lang=v.lang}

const bufCache={},bufCacheS={};let curSrc=null;
function b64ToBuf(b){const s=atob(b),u=new Uint8Array(s.length);for(let k=0;k<s.length;k++)u[k]=s.charCodeAt(k);return u.buffer}
function decodeClip(c,w,sl){const BC=sl?bufCacheS:bufCache,SRC=sl?AUDIO_SLOW:AUDIO;if(BC[w])return Promise.resolve(BC[w]);
 return new Promise((res,rej)=>{if(!SRC[w]){rej(0);return}try{const p=c.decodeAudioData(b64ToBuf(SRC[w]),b=>{BC[w]=b;res(b)},rej);if(p&&p.catch)p.catch(rej)}catch(e){rej(e)}})}
function playBuf(c,b,slow){if(curSrc){try{curSrc.stop()}catch(e){}}const s=c.createBufferSource();s.buffer=b;s.playbackRate.value=1;s.connect(c.destination);s.start();curSrc=s}
function say(text,slow,fromClick){
 if(fromClick)unlocked=true;
 let c=null;try{c=ctx()}catch(e){}
 if(c){if(c.state!=="running")c.resume();
  const BC=slow?bufCacheS:bufCache;if(BC[text]){playBuf(c,BC[text],slow);return}

function tone(f,t0,d,type,vol){const c=ctx(),o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,c.currentTime+t0);

const cv=$("fx"),cx=cv.getContext("2d");let parts=[],raf=null;
function resize(){cv.width=innerWidth;cv.height=innerHeight}addEventListener("resize",resize);resize();
function burst(x,y){const cols=["#f43f5e","#f59e0b","#22c55e","#3b82f6","#a855f7","#facc15"];
 for(let k=0;k<110;k++){const a=Math.random()*Math.PI*2,s=4+Math.random()*9;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-5,r:4+Math.random()*5,c:cols[k%6],life:80+Math.random()*40,star:Math.random()<.3,rot:Math.random()*6})}
 if(!raf)loop()}
function starPath(r){cx.beginPath();for(let k=0;k<10;k++){const rr=k%2?r/2:r,a=k*Math.PI/5;cx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}cx.closePath()}
function loop(){cx.clearRect(0,0,cv.width,cv.height);parts=parts.filter(p=>p.life>0);
 parts.forEach(p=>{p.vy+=.25;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.life--;p.rot+=.1;cx.save();cx.globalAlpha=Math.min(1,p.life/40);cx.translate(p.x,p.y);cx.rotate(p.rot);cx.fillStyle=p.c;

 clearTimeout(timer);timer=setTimeout(goNext,2000);
}
function finish(){sendResult(true);if(!document.getElementById("sentnote")){const n=document.createElement("div");n.id="sentnote";n.style.cssText="font-size:12px;opacity:.6;margin-top:8px";$("final").appendChild(n)}
 $("game").style.display="none";$("final").style.display="block";
 $("fscore").textContent=`${bn(score)}/${bn(order.length)}`;
 const p=score/order.length;
 $("fmsg").textContent=p===1?"আকিফ, সবগুলো ঠিক! খুবই ভালো করেছ। Excellent. 🌹":p>=.7?"আকিফ, খুবই ভালো করেছ। Very good. 🌻":"ভালো চেষ্টা। ভুলগুলো আরেকবার দেখে নাও। 👍";
 if(p>=.7){chime();burst(innerWidth/2,innerHeight/3)}
}
function goNext(){clearTimeout(timer);timer=null;i++;if(i<order.length){show();if(unlocked)tryPlay(order[i].w,false,false)}else finish()}
$("play").onclick=()=>tryPlay(order[i].w,false,true);
$("slow").onclick=()=>tryPlay(order[i].w,true,true);
$("next").onclick=goNext;
$("again").onclick=()=>{clearTimeout(timer);start();tryPlay(order[0].w,false,true)};
start();
ntfyFlush();
</script>
